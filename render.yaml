# Деплой на Render. Подробности и оговорки — в README, раздел «Деплой на Render».
#
# Это background worker, а не web service: бот держит длинный опрос Telegram и фоновые круги
# сбора. Бесплатные веб-сервисы Render засыпают через 15 минут без входящих запросов —
# для такого бота это означает «молчит почти всегда». Воркеров на бесплатном тарифе нет.
services:
  - name: zlinbot
    type: worker
    runtime: docker
    plan: 0.5c-512mb        # самый дешёвый платный размер; без Chromium памяти хватает
    region: frankfurt          # ближе к Чехии: и к источникам, и к Telegram
    dockerfilePath: ./Dockerfile
    autoDeploy: false          # деплой по кнопке: бот пишет в реальный канал
    maxShutdownDelaySeconds: 30  # успеть закрыть опрос Telegram до SIGKILL
    disk:
      name: zlinbot-data       # без диска SQLite и кэш медиа стираются при каждом деплое
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false            # секреты вводятся в панели Render, в git их нет
      - key: ADMIN_ID
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: DB_PATH
        value: /data/zlinbot.db
      - key: MEDIA_DIR
        value: /data/media
      - key: DEBUG_DIR
        value: /data/debug
